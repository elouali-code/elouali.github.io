<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Blue background -->
  <rect width="200" height="200" fill="#003399"/>
  <!-- Outer circle -->
  <circle cx="95" cy="100" r="58" fill="none" stroke="white" stroke-width="3.5"/>
  <!-- Inner circle -->
  <circle cx="95" cy="100" r="38" fill="none" stroke="white" stroke-width="3"/>
  <!-- Swooping lines representing accelerator paths -->
  <path d="M 40 155 Q 60 90 95 60" fill="none" stroke="white" stroke-width="3"/>
  <path d="M 150 45 Q 130 110 95 140" fill="none" stroke="white" stroke-width="3"/>
  <path d="M 30 60 L 95 42 L 170 55" fill="none" stroke="white" stroke-width="3"/>
  <path d="M 30 145 L 95 158 L 175 148" fill="none" stroke="white" stroke-width="3"/>
  <!-- Diagonal lines extending outside -->
  <line x1="45" y1="30" x2="170" y2="30" stroke="white" stroke-width="3"/>
  <line x1="170" y1="30" x2="170" y2="170" stroke="white" stroke-width="3"/>
  <line x1="45" y1="170" x2="45" y2="30" stroke="white" stroke-width="2.5"/>
  <!-- CERN text -->
  <text x="95" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="white" letter-spacing="2">CERN</text>
</svg>
